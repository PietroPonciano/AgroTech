        <section class="fale-conosco">
            <h2>Fale Conosco</h2>

            <div class="container-form">

                <form action="" id="formulario">
                    <div class="linha">
                        <div>
                            <label>Nome Completo:</label>
                            <input type="text" class="input-fale" placeholder="Ex: João Gomes" id="nome-completo">
                        </div>

                        <div>
                            <label>E-mail:</label>
                            <input type="email" class="input-fale" placeholder="example@gmail.com" id="email">
                        </div>
                    </div>
                    <div>
                        <label>Mensagem:</label>
                        <textarea class="input-fale" rows="4" id="mensagem"></textarea>
                    </div>
                    <div class="file-upload">
                        <label for="arquivo">Anexar Arquivo:</label>
                        <input type="file" id="arquivo">
                    </div>
                    <button type="button" id="btn" onclick="EnviaForm()">Enviar</button>

                    <p id="erro" class="hidden"></p>
                </form>
                <div class="imagem-form">
                    <img src="../img/fale-conosco-icon-lateral.png" alt="Contato">
                </div>

            </div>
        </section>
